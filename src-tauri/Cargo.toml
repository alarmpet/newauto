[package]
name = "newauto-studio"
version = "0.1.0"
description = "newauto Studio desktop shell"
authors = ["newauto"]
edition = "2021"

[package.metadata]

[lib]
name = "newauto_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading"
] }
