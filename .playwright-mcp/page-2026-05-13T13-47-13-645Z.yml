            - strong [ref=e123]: 제미나이 통합해 매직 포인터 구현
            - generic [ref=e124]:
              - generic [ref=e126]:
                - img "구글북 실행 예시. 구글 블로그 캡처"
              - emphasis [ref=e127]: 구글북 실행 예시. 구글 블로그 캡처
            - text: 구글의 인공지능(AI) 모델인 제미나이를 통합한 노트북이 출시된다. 마우스 커서만 움직이면 AI가 실행된다.
            - text: 구글은 12일(현지 시간) 안드로이드와 크롬 운영체제(OS)에 제미나이 모델을 통합한 ‘구글북’을 공개했다.
            - text: 구글북은 크롬북의 뒤를 잇는 새로운 노트북 브랜드다. 알렉스 쿠셔 구글 수석 이사는 블로그 게시글에서 “15년 전 선보인 크롬북이 클라우드 중심이었다면 구글북은 AI가 중심인 새로운 노트북”이라고 소개했다.
            - text: 구글북의 핵심은 ‘매직 포인터(Magic Pointer)’다. 사용자가 화면에서 마우스 커서를 흔들면 제미나이가 활성화되고 화면 특정 위치를 가리킬 때마다 상황에 맞는 제안을 한다. 이메일 날짜를 고려해 회의 일정을 잡거나 거실과 새 소파처럼 두 이미지를 결합해 시각화할 수 있다. 몇 번의 클릭만으로 아이디어를 구체화하고 작업을 완료할 수도 있다.
            - text: 매직 포인터 기능에 대해 구글은 커서가 노트북에서 가장 자주 사용하는 도구이지만 마우스 오른쪽 클릭 기능 이후 큰 변화가 없었다면서 구글 딥마인드 팀과 함께 개발한 새 기능으로 환경이 크게 바뀔 것이라고 강조했다.
            - text: 구글은 에이서·에이수스·델·HP·레노버 등 주요 하드웨어 기업들과 협력해 올 가을께 구글북을 선보일 계획이다. 악시오스는 애플이 저가형 맥북 네오를 출시하며 인기몰이 중인 가운데 구글도 크롬북 뛰어넘는 모델 내놓으며 노트북 사업에서 승부수를 던졌다고 설명했다.
